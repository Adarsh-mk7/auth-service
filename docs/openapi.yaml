openapi: 3.0.3
info:
  title: Production-Ready Authentication & Authorization Service
  description: |
    A modular, secure authentication and RBAC authorization microservice built with Express.js,
    TypeScript, PostgreSQL (Prisma ORM), Redis, and Passport.js Google OAuth 2.0.
  version: 1.0.0
  contact:
    name: API Support
    email: support@auth-service.local
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:4000
    description: Local Development Server

tags:
  - name: Health
    description: Service health and liveness
  - name: Authentication
    description: Registration, Login, Token Refresh, and Logout
  - name: Password Management
    description: Forgot password, Reset password, and Change password
  - name: Sessions
    description: Active session tracking and revocation
  - name: OAuth
    description: Google OAuth 2.0 authentication
  - name: Users
    description: User directory and ownership-protected endpoints
  - name: Admin
    description: Administrative management and RBAC role assignment

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your access JWT token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Secure HTTP-only refresh token cookie.

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
        errors:
          type: array
          items:
            type: object

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [USER, MODERATOR, ADMIN]
        isEmailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userAgent:
          type: string
          nullable: true
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        isCurrentSession:
          type: boolean

paths:
  /health:
    get:
      tags: [Health]
      summary: Service health check
      responses:
        200:
          description: Service is healthy

  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  example: SecurePass123!
      responses:
        201:
          description: User registered successfully
        400:
          description: Validation failure
        409:
          description: Email already registered

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user with credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        200:
          description: Authentication successful, sets refresh_token cookie
        401:
          description: Invalid email or password
        429:
          description: Too many login attempts

  /api/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token and issue new access token
      security:
        - cookieAuth: []
      responses:
        200:
          description: Tokens refreshed successfully
        401:
          description: Invalid or revoked refresh token

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out current session
      responses:
        200:
          description: Logged out successfully

  /api/auth/logout-all:
    post:
      tags: [Authentication]
      summary: Revoke all active sessions for current user
      security:
        - bearerAuth: []
      responses:
        200:
          description: All active sessions revoked
        401:
          description: Authentication required

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Retrieve current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        200:
          description: Profile retrieved
        401:
          description: Authentication required

  /api/auth/sessions:
    get:
      tags: [Sessions]
      summary: List all active sessions for current user
      security:
        - bearerAuth: []
      responses:
        200:
          description: Active sessions list
        401:
          description: Authentication required

  /api/auth/forgot-password:
    post:
      tags: [Password Management]
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          description: Generic confirmation response

  /api/auth/reset-password:
    post:
      tags: [Password Management]
      summary: Reset password with single-use reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
      responses:
        200:
          description: Password reset successfully
        400:
          description: Invalid, expired, or already used token

  /api/auth/change-password:
    post:
      tags: [Password Management]
      summary: Change password for authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        200:
          description: Password changed successfully
        400:
          description: Validation failure
        401:
          description: Incorrect current password

  /api/auth/google:
    get:
      tags: [OAuth]
      summary: Initiate Google OAuth 2.0 authentication
      responses:
        302:
          description: Redirects to Google consent screen
        503:
          description: Google OAuth unconfigured

  /api/auth/google/callback:
    get:
      tags: [OAuth]
      summary: Handle Google OAuth 2.0 callback
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: Google authentication successful
        403:
          description: Invalid CSRF state

  /api/users:
    get:
      tags: [Users]
      summary: List users (filtered based on requester role)
      security:
        - bearerAuth: []
      responses:
        200:
          description: Users list
        401:
          description: Authentication required

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Retrieve specific user profile (enforces resource ownership)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: User profile
        403:
          description: Forbidden (accessing another user's profile)

  /api/admin/users:
    get:
      tags: [Admin]
      summary: Administrative user management list
      security:
        - bearerAuth: []
      responses:
        200:
          description: Full administrative user list
        403:
          description: Forbidden (ADMIN role required)

  /api/admin/users/{id}/role:
    patch:
      tags: [Admin]
      summary: Update a user's role
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [USER, MODERATOR, ADMIN]
      responses:
        200:
          description: Role updated successfully
        400:
          description: Cannot demote sole administrator
        403:
          description: Forbidden (ADMIN role required)
